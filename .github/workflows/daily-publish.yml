name: Daily Autonomous Story Publisher & Self-Updater

on:
  schedule:
    # Runs every day at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  publish-daily-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Story Writer
        run: |
          python daily_writer.py

      - name: Commit and Push Changes
        run: |
          git config user.name "The Pulse Collective (Pulse Bot)"
          git config user.email "bot@pulsecollective.dev"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit (today's story already published)."
          else
            git commit -m "Auto-publish: Daily Pulse Edition [skip ci]"
            git push origin main
          fi
